<!DOCTYPE html>
<html>
<head>
    <title>Test Rescue Report Submission</title>
</head>
<body>
    <h1>Test Rescue Report Submission</h1>
    <form id="rescueForm">
        <div>
            <label>Animal Type:</label>
            <input type="text" name="animalType" value="Dog" required>
        </div>
        <div>
            <label>Urgency Level:</label>
            <select name="urgencyLevel" required>
                <option value="critical">Critical</option>
                <option value="urgent" selected>Urgent</option>
                <option value="moderate">Moderate</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div>
            <label>Animal Condition:</label>
            <input type="text" name="animalCondition" value="Injured" required>
        </div>
        <div>
            <label>Location:</label>
            <input type="text" name="location" value="123 Main Street, Test City" required>
        </div>
        <div>
            <label>Description:</label>
            <textarea name="description">Found injured dog on the street</textarea>
        </div>
        <div>
            <label>Reporter Name:</label>
            <input type="text" name="reporterName" value="Test Reporter" required>
        </div>
        <div>
            <label>Reporter Phone:</label>
            <input type="text" name="reporterPhone" value="555-1234" required>
        </div>
        <div>
            <label>Reporter Email:</label>
            <input type="email" name="reporterEmail" value="test@example.com">
        </div>
        <div>
            <label>Latitude:</label>
            <input type="number" name="latitude" value="45.5017" step="any" required>
        </div>
        <div>
            <label>Longitude:</label>
            <input type="number" name="longitude" value="-73.5673" step="any" required>
        </div>
        <button type="submit">Submit Report</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('rescueForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            
            try {
                // Convert FormData to JSON object
                const data = {};
                for (let [key, value] of formData.entries()) {
                    data[key] = value;
                }

                const response = await fetch('http://localhost:8080/api/RescueReports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = '<h3 style="color: green;">SUCCESS!</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = '<h3 style="color: red;">ERROR ' + response.status + '</h3><pre>' + errorText + '</pre>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<h3 style="color: red;">NETWORK ERROR</h3><pre>' + error.message + '</pre>';
            }
        });
    </script>
</body>
</html>
